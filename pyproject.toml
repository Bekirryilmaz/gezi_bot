[project]
name = "samandira"
version = "0.1.0"
requires-python = ">=3.12"
description = "Şamandıra — geliştirme araçları (ruff/mypy). Çalışma zamanı bağımlılıkları sunucu/requirements.txt içindedir."

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["sunucu", "ortak", "veri"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sunucu/api", "ortak"]
ignore_missing_imports = true
