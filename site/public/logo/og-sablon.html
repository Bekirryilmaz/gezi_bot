<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Şamandıra OG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #6c0000;
        color: #fbf8f3;
      }
      .sahne {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #6c0000;
      }
      .kilit {
        position: absolute;
        left: 72px;
        top: 64px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .kilit img {
        width: 88px;
        height: 88px;
        display: block;
      }
      .kilit span {
        font-family: Fraunces, Georgia, serif;
        font-size: 42px;
        letter-spacing: -0.02em;
        font-weight: 500;
      }
      h1 {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 200px;
        margin: 0;
        font-family: Fraunces, Georgia, serif;
        font-size: 68px;
        line-height: 1.02;
        letter-spacing: -0.03em;
        font-weight: 500;
        text-wrap: balance;
      }
      p {
        position: absolute;
        left: 72px;
        right: 96px;
        bottom: 72px;
        margin: 0;
        font-family: Sora, system-ui, sans-serif;
        font-size: 22px;
        line-height: 1.45;
        color: #fbf8f3;
        max-width: 920px;
      }
    </style>
  </head>
  <body>
    <div class="sahne">
      <div class="kilit">
        <img src="./karo-seffaf.png" width="88" height="88" alt="" />
        <span>şamandıra</span>
      </div>
      <h1>Gezilecek yerleri işaretler.</h1>
      <p>
        Şamandıra, bir şehirdeki gezilecek yerleri deneyim eksenlerine göre puanlayan
        ve gün gün rota kuran bir gezi rehberidir.
      </p>
    </div>
  </body>
</html>
