; Alembic yapilandirma dosyasi.
; Calistirmak icin sunucu/ klasorunun icinden: alembic upgrade head

[alembic]
script_location = veritabani/migrasyonlar
prepend_sys_path = .
version_path_separator = os

; Veritabani adresi burada DEGIL -- migrasyonlar/env.py icinde
; VERITABANI_URL ortam degiskeninden okunuyor (sifrenin dosyada
; duz metin olarak durmamasi icin).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
