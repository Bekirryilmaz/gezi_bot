<!-- T-16 Faz 1  Konsept 2: UFUK (ufku bolen govde)
     Halka + iki parcali ufuk cizgisi + yansima.
     Tur 1 su alti kesikli yay icerdi; dairenin dibinde okunmayan leke
     olusturdu ve 16px'te isareti bulanik yapti -> kaldirildi.
     Tur 2 halkayi kalinlastirdi, ufuk bosluklarini halkanin gercek
     silueti (x 10..22) ile hizaladi.
     Tur 3 ufuk cizgilerini cerceve kenarina kadar uzatti.
     Favicon'da en dayanikli form: tek daire + tek yatay cizgi. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     fill="none" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-label="Samandira - Ufuk konsepti">
  <path d="M 1.6 21.4 H 9" stroke="#0A4D5C" stroke-width="2.2"/>
  <path d="M 23 21.4 H 30.4" stroke="#0A4D5C" stroke-width="2.2"/>
  <circle cx="16" cy="15.6" r="6" stroke="#D6402C" stroke-width="2.8"/>
  <path d="M 12.6 25.8 H 19.4" stroke="#0A4D5C" stroke-width="1.8" opacity="0.45"/>
</svg>
