<!-- T-16 Faz 1  Konsept 1: SONAR (samandiranin sinyali)
     Dikey kapsul govde + iki basik esmerkezli halka.
     Tur 1 esmerkezli yaylar kullandi, wifi ikonu gibi okundu.
     Tur 2 yaylari basik elipse cevirdi (suya acili bakis).
     Tur 3 govde kapsulunu uzatti (5.6 -> 9.4) ki hakim eleman olsun.
     Tur 4 siluet testinde kusuru buldu: cizgiler 3.4'e cikinca iki
     halka ust/alt uclarda birlesip dolu mercek lekesine donuyor. Bu
     kurulumda cozulemez -- dis ry 4.6 ile ic ry 2.8 arasindaki 1.8
     birimlik aciklik, iki cizginin yariciaplari toplami olan 3.4'ten
     kucuk.
     Tur 5 alternatifi denedi: esmerkezli elipsler dikeyde ayrilmis iki
     asagi-bombeli yaya cevrildi. Siluet duzeldi ama isaret bu kez
     birebir "indir" (download) ikonuna dondu; govdeyi lozenge'e
     genisletmek de kurtarmadi. Klise carpismasi lekeden agir bir kusur
     oldugu icin tur 3 geometrisine geri donuldu.
     Bilinen sinir: cizgilerin kalinlastigi tek renk baski/kabartma.
     Kilavuz 32x32, cizgi ailesi 2.8 / 2.2 / 1.8. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     fill="none" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-label="Samandira - Sonar konsepti">
  <ellipse cx="16" cy="20.2" rx="12.4" ry="4.6" stroke="#0A4D5C" stroke-width="1.8" opacity="0.45"/>
  <ellipse cx="16" cy="20.2" rx="7.6" ry="2.8" stroke="#0A4D5C" stroke-width="2.2"/>
  <rect x="14.4" y="9.8" width="3.2" height="9.4" rx="1.6" fill="#D6402C"/>
</svg>
