<!-- T-16 Faz 1  Konsept 4: DEMIR (samandiranin zinciri)
     45 derecelik ortak eksende iki bakla, ucta 3.6 birim gecisme.
     Tur 1 halka + iki DIKEY bakla kullandi; kucuk boyutta baklalar tek
     bir sapa donusup isaret "anahtar/lolipop" gibi okundu.
     Tur 2 tek, daha buyuk ve delikli bakla birakti.
     Tur 3 alt baklayi dikeyden yataya cevirdi (rx/ry takasi) ama siluet
     hala tek leke ("anahtar deligi") olarak okundu: alt bakla ust
     halkadan DAR kaldigi icin silueti genisletmiyor, altini
     dolduruyordu.
     Tur 4 orani tersine cevirdi (ust halka kucuk, alt bakla genis);
     leke dagildi ama dikey eksende ust uste iki halka kacinilmaz
     olarak "8" rakami / kardan adam gibi okundu.
     Tur 5 sorunu eksende cozdu: gercek zincir dikey degil DIYAGONAL
     dizilir. Iki bakla 45 derecelik ortak eksene yatirildi, her biri o
     eksen boyunca uzatildi (rx 5.2 / ry 3.6) ve merkezleri eksende 9
     birim ayrildi -- bu da baklanin ucunda 3.6 birimlik gercek bir
     gecisme birakiyor. Diyagonal hem "8" okumasini kiriyor hem
     cerceveyi kosegen boyunca doldurdugu icin 16px'te iki delik de
     acik kaliyor.
     Kilavuz 32x32, cizgi ailesi 2.8 / 2.2 / 1.8. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     fill="none" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-label="Samandira - Demir konsepti">
  <!-- alt-sol bakla (baglam) -->
  <ellipse cx="12.8" cy="19.2" rx="5.2" ry="3.6" transform="rotate(-45 12.8 19.2)"
           stroke="#0A4D5C" stroke-width="2.2"/>
  <!-- ust-sag bakla (vurgu) - zincirin ucu, "demir atilan" nokta -->
  <ellipse cx="19.2" cy="12.8" rx="5.2" ry="3.6" transform="rotate(-45 19.2 12.8)"
           stroke="#D6402C" stroke-width="2.8"/>
</svg>
