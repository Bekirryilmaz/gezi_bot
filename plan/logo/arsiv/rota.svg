<!-- T-16 Faz 1  Konsept 3: ROTA (samandiralarin dizilimi)
     Uc dugum + kesikli hat; tepe dugum vurgulu ("isaretlenen yer").
     Tur 2 yan dugumleri kucultup (2.5 -> 2.2) cizgilerini inceltti ki
     vurgulu tepe dugumu tek hakim odak kalsin; kesik ritmi sikildi.
     Urunun asil isini (gun gun rota) dogrudan anlatan konsept.
     Kilavuz 32x32, cizgi ailesi 2.8 / 2.2 / 1.8. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     fill="none" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-label="Samandira - Rota konsepti">
  <path d="M 5.8 24.2 C 8.8 17.6, 11.6 12.4, 16 10.9 C 20.4 9.4, 24.3 13.9, 26.2 20.4"
        stroke="#0A4D5C" stroke-width="1.8" stroke-dasharray="1.2 2.8" opacity="0.45"/>
  <circle cx="5.8" cy="24.2" r="2.2" stroke="#0A4D5C" stroke-width="1.8"/>
  <circle cx="26.2" cy="20.4" r="2.2" stroke="#0A4D5C" stroke-width="1.8"/>
  <circle cx="16" cy="10.9" r="3.4" fill="#D6402C"/>
</svg>
